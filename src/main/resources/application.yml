spring:
  application:
    name: booking-service
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ev_booking_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

server:
  port: ${SERVER_PORT:8003}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: ${spring.application.name}:${server.port}

# JWT_SECRET must match user-service/provider-service's -- this service only validates tokens
# they issue, it never signs its own.
jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidationWithMinimum32Characters}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://evrechargeindia.com,https://www.evrechargeindia.com,http://localhost:4200}

logging:
  level:
    root: INFO
    com.evcharging: DEBUG
  file:
    name: logs/booking-service.log

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
